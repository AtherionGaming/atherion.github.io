<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Atherion Gaming</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
body{
margin:0;
font-family:Arial;
background-image:url('https://metin2.download/picture/UOIXWBG4d1PsC0Bjiga6EHj4c380szxg/.jpg');
background-size:cover;
color:white;
}

.header{
text-align:center;
font-family:'Cinzel';
font-size:60px;
color:#00cfff;
text-shadow:0 0 30px #00cfff;
margin-bottom:10px;
}

.dashboard{
display:none;
height:100vh;
flex-direction:column;
}

.dashboard-body{
display:flex;
flex:1;
}

.menu{
width:220px;
background:rgba(0,0,0,0.8);
padding:20px;
display:flex;
flex-direction:column;
gap:10px;
}

.menu-slot{
padding:12px;
border:2px solid #3a6f9e;
border-radius:8px;
text-align:center;
cursor:pointer;
font-family:'Cinzel';
color:#00cfff;
background:#070d14;
transition:0.3s;
}

.menu-slot:hover{
box-shadow:0 0 20px #00cfff;
}

.content{
flex:1;
background:rgba(0,0,0,0.6);
padding:25px;
overflow:auto;
border-radius:10px;
margin-left:10px;
}

.gallery{
display:grid;
grid-template-columns:repeat(auto-fill,150px);
gap:15px;
margin-top:20px;
}

.gallery img{
width:150px;
height:150px;
object-fit:cover;
border-radius:8px;
border:2px solid #00cfff;
}

.upload-form{
display:flex;
flex-direction:column;
gap:10px;
width:300px;
}

.upload-form input,
.upload-form button{
padding:8px;
border-radius:6px;
border:2px solid #00cfff;
background:#001a26;
color:#00eaff;
font-family:'Cinzel';
}

.start-screen{
height:100vh;
display:flex;
align-items:center;
justify-content:center;
gap:60px;
background:rgba(0,0,0,0.7);
}

.start-btn{
padding:25px 50px;
font-size:28px;
font-family:'Cinzel';
border:2px solid #00cfff;
background:linear-gradient(#0b1a2a,#02060c);
color:#00eaff;
cursor:pointer;
border-radius:12px;
transition:0.3s;
}
</style>
</head>

<body>

<div class="start-screen" id="start">
<button class="start-btn" onclick="enter('magic')">Magic Time Two</button>
<button class="start-btn" onclick="enter('mystic')">Mystic of Masters</button>
</div>

<div class="dashboard" id="dashboard">
<div class="header">Atherion Gaming</div>

<div class="dashboard-body">
<div class="menu" id="menu"></div>
<div class="content" id="mainContent"></div>
</div>
</div>

<script>

/* SUPABASE CONFIG */
const supabaseUrl = "https://stdlzcitdmapnsulqmdi.supabase.co";
const supabaseKey = "sb_publishable_WlXi3AVW5wKWUwvNSG2ffA_lOnWtL8X";
const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

/* SCRIPT CONFIG */
const config = {
magic:{
script:"https://script.google.com/macros/s/AKfycbxpzxIoRx9c-eHiolmtLIF10hy9QtSREJZmUcCdaSjf8hpD1ytfnwcJh1esW_Fl8Cyy4g/exec",
yt:"https://www.youtube.com/@atheriongames8520"
},
mystic:{
script:"https://script.google.com/macros/s/AKfycbx170_GtIceSLF6Az3Hdl5VvppkbdZJCKrFrKUytScbt5ZKawRsRmijstGrQzhDCJDD/exec",
yt:"https://www.youtube.com/@AndurilMysticofMasters"
}
};

let current="";
const mainContent=document.getElementById("mainContent");

function enter(type){
current=type;
document.getElementById("start").style.display="none";
document.getElementById("dashboard").style.display="flex";
loadMenu();
}

function goBack(){
document.getElementById("start").style.display="flex";
document.getElementById("dashboard").style.display="none";
}

/* MENU */
function loadMenu(){
const menu=document.getElementById("menu");
menu.innerHTML="";

createMenu("Vissza",goBack);

if(current==="magic")
createMenu("Eventek",()=>window.open(config.magic.script));

if(current==="mystic")
createMenu("Metin Spawn",()=>window.open(config.mystic.script));

createMenu("YouTube",()=>window.open(config[current].yt));

createMenu("Galéria",showGallery);

createMenu("Feltöltés",showUploadForm);
}

function createMenu(name,action){
const div=document.createElement("div");
div.className="menu-slot";
div.textContent=name;
div.onclick=action;
menu.appendChild(div);
}

/* GALÉRIA */
async function showGallery(){
const { data } = await supabase
.from("images")
.select("*")
.eq("server", current);

let html=`<div class="gallery">`;

data.forEach(img=>{
html+=`<img src="${img.url}">`;
});

html+=`</div>`;
mainContent.innerHTML=html;
}

/* FELTÖLTÉS */
function showUploadForm(){
mainContent.innerHTML=`
<div class="upload-form">
<input type="file" id="imgInput">
<input type="date" id="uploadDate">
<input type="text" id="uploaderName" placeholder="Feltöltő neve">
<button onclick="uploadImage()">Feltöltés</button>
</div>
`;
}

async function uploadImage(){
const file=document.getElementById("imgInput").files[0];
const date=document.getElementById("uploadDate").value;
const name=document.getElementById("uploaderName").value;

const fileName=Date.now()+"_"+file.name;

await supabase.storage
.from("gallery")
.upload(fileName,file);

const { data } = supabase.storage
.from("gallery")
.getPublicUrl(fileName);

await supabase
.from("images")
.insert({
url:data.publicUrl,
server:current,
uploader:name,
date:date
});

alert("Feltöltve!");
}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atherion Gaming</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Arial;background-image:url('https://metin2.download/picture/UOIXWBG4d1PsC0Bjiga6EHj4c380szxg/.jpg');background-size:cover;color:white;}
.header{text-align:center;font-family:'Cinzel';font-size:60px;color:#00cfff;text-shadow:0 0 30px #00cfff;margin-bottom:10px;}
.dashboard{display:none;height:100vh;flex-direction:column;}
.dashboard-body{display:flex;flex:1;}
.menu{width:220px;background:rgba(0,0,0,0.8);padding:20px;display:flex;flex-direction:column;gap:10px;}
.menu-slot{padding:12px;border:2px solid #3a6f9e;border-radius:8px;text-align:center;cursor:pointer;font-family:'Cinzel';color:#00cfff;background:#070d14;transition:0.3s;}
.menu-slot:hover{box-shadow:0 0 20px #00cfff;}
.content{flex:1;background:rgba(0,0,0,0.6);padding:25px;overflow:auto;border-radius:10px;margin-left:10px;}
.start-screen{height:100vh;display:flex;align-items:center;justify-content:center;gap:60px;background:rgba(0,0,0,0.7);}
.start-btn{padding:25px 50px;font-size:28px;font-family:'Cinzel';border:2px solid #00cfff;background:linear-gradient(#0b1a2a,#02060c);color:#00eaff;cursor:pointer;border-radius:12px;transition:0.3s;box-shadow:0 0 20px rgba(0,200,255,0.4);}
.start-btn:hover{transform:scale(1.1);box-shadow:0 0 40px #00cfff;}

/* Metinkő kalkulátor stílus */
#metinCalc{margin-top:20px;padding:15px;border:2px solid #00cfff;border-radius:10px;background:rgba(0,20,30,0.8);}
#metinCalc input{width:20%;padding:5px;border-radius:6px;border:2px solid #00cfff;background:#001a26;color:#00eaff;margin:2px;text-align:center;}
#metinCalc button{padding:8px 12px;margin:5px;border-radius:6px;border:2px solid #00cfff;background:#001a26;color:#00eaff;cursor:pointer;}
#visszaszamlalo-bar{margin-top:10px;height:25px;background-color:rgba(0,0,0,0.5);border:2px solid #00cfff;border-radius:12px;position:relative;}
#visszaFill{height:100%;width:100%;background-color:rgba(0,200,255,0.6);border-radius:12px;position:relative;z-index:1;overflow:hidden;}
#visszaFill::before{content:"";position:absolute;top:0;left:-50%;width:50%;height:100%;background:linear-gradient(90deg, rgba(255,255,255,0.6) 0%, rgba(255,255,255,0) 100%);transform:skewX(-20deg);filter: blur(2px);animation:shine 2s linear infinite;}
@keyframes shine{0%{left:-50%;}100%{left:150%;}}
#visszaText{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:14px;color:#00eaff;z-index:2;text-shadow:0 0 6px #00cfff;}
#modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);justify-content:center;align-items:center;z-index:9999;}
#modalContent{width:80%;max-width:500px;height:80%;max-height:400px;background:#001a26;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
#modalContent div{color:#00eaff;padding:10px;background:rgba(0,0,0,0.5);border-radius:8px;}
#modalContent button{margin-top:15px;padding:8px 15px;border:none;border-radius:6px;background:#00cfff;color:#001a26;font-weight:bold;cursor:pointer;}
</style>
</head>
<body>

<div class="start-screen" id="start">
<button class="start-btn" onclick="enter('magic')">Magic Time Two</button>
<button class="start-btn" onclick="enter('mystic')">Mystic of Masters</button>
</div>

<div class="dashboard" id="dashboard">
<div class="header">Atherion Gaming</div>
<div class="dashboard-body">
<div class="menu" id="menu"></div>
<div class="content" id="mainContent"></div>
</div>
</div>

<!-- Modal a spawn értesítéshez -->
<div id="modal">
<div id="modalContent">
<div id="modalText"></div>
<button onclick="closeModal()">OK</button>
</div>
</div>

<script>
// Dashboard & Menu
let current="";
const config={
magic:{title:"Magic Time Two", scripts:[{name:"Eventek", url:"https://script.google.com/macros/s/AKfycbxpzxIoRx9c-eHiolmtLIF10hy9QtSREJZmUcCdaSjf8hpD1ytfnwcJh1esW_Fl8Cyy4g/exec"}], yt:"https://www.youtube.com/@atheriongames8520"},
mystic:{title:"Mystic of Masters", scripts:[], yt:"https://www.youtube.com/@AndurilMysticofMasters"}
};
function enter(type){
  current=type;
  document.getElementById("start").style.display="none";
  document.getElementById("dashboard").style.display="flex";
  loadMenu();
  mainContent.innerHTML="";
  if(current==="mystic") loadMetinCalc(); // beágyazott metinkő kalkulátor
}
function goBack(){
  window.location.href="https://atheriongaming.github.io/index/";
}
function loadMenu(){
  const menu=document.getElementById("menu");
  menu.innerHTML="";
  const back=document.createElement("div"); back.className="menu-slot"; back.textContent="Vissza"; back.onclick=goBack; menu.appendChild(back);
  config[current].scripts.forEach(s=>{
    const div=document.createElement("div");
    div.className="menu-slot";
    div.textContent=s.name;
    div.onclick=()=>{window.open(s.url,"_blank");};
    menu.appendChild(div);
  });
  const ytBtn=document.createElement("div"); ytBtn.className="menu-slot"; ytBtn.textContent="YouTube"; ytBtn.onclick=()=>{window.open(config[current].yt,"_blank");}; menu.appendChild(ytBtn);
  const galBtn=document.createElement("div"); galBtn.className="menu-slot"; galBtn.textContent="Galéria"; galBtn.onclick=()=>{window.location.href="https://atheriongaming.github.io/gallery/";}; menu.appendChild(galBtn);
}

// Metinkő kalkulátor beágyazása
function loadMetinCalc(){
  const html=`<div id="metinCalc">
    <label>Dátum:</label><input type="date" id="datum">
    <div class="time-panel">
      <input type="text" id="ido-ora" maxlength="2"><span>:</span>
      <input type="text" id="ido-perc" maxlength="2"><span>:</span>
      <input type="text" id="ido-mp" maxlength="2">
    </div>
    <div class="time-panel">
      <input type="text" id="resp-ora" maxlength="2"><span>:</span>
      <input type="text" id="resp-perc" maxlength="2"><span>:</span>
      <input type="text" id="resp-mp" maxlength="2">
    </div>
    <button onclick="indit()">Indítás</button>
    <button onclick="stop()">STOP</button>
    <button onclick="toggleFiveMin()" id="fiveMinBtn">5 perc figyelmeztetés</button>
    <button onclick="toggleAutoRestart()" id="autoBtn">Automata újraindítás</button>
    <div id="visszaszamlalo-bar"><div id="visszaFill"></div><div id="visszaText">00:00:00</div></div>
    <div id="eredmeny"></div>
    <div id="aktualisIdo"></div>
  </div>`;
  mainContent.innerHTML=html;
  beallitMaiDatum(); frissitIdo();
}

// --- Metinkő kalkulátor script --- //
let interval=null,fiveMinAlert=false,fiveMinShown=false,autoRestart=false,totalMs=0,nextSpawn=null;
function toggleFiveMin(){fiveMinAlert=!fiveMinAlert;fiveMinShown=false;document.getElementById("fiveMinBtn").style.background=fiveMinAlert?"#228b22":"#001a26";}
function toggleAutoRestart(){autoRestart=!autoRestart;document.getElementById("autoBtn").style.background=autoRestart?"#228b22":"#001a26";}
function beallitMaiDatum(){const ma=new Date();document.getElementById("datum").value=`${ma.getFullYear()}-${String(ma.getMonth()+1).padStart(2,'0')}-${String(ma.getDate()).padStart(2,'0')}`;}
function frissitIdo(){document.getElementById("aktualisIdo").innerText="Jelenlegi idő: "+new Date().toLocaleString("hu-HU");}
setInterval(frissitIdo,1000);
function showModal(text,isRespawn=false){const audio=document.getElementById("bellSound")||new Audio('https://freesound.org/data/previews/341/341695_624378-lq.mp3'); audio.play(); const modal=document.getElementById("modal"); modal.style.display="flex"; document.getElementById("modalText").innerText=text; modal.dataset.respawn=isRespawn;}
function closeModal(){const modal=document.getElementById("modal"); modal.style.display="none"; if(modal.dataset.respawn==="true" && autoRestart) indit();}
function indit(){
  if(interval) clearInterval(interval);
  const datum=document.getElementById("datum").value;
  if(!datum){document.getElementById("eredmeny").innerText="Adj meg dátumot!";return;}
  const [ev, honap, nap]=datum.split("-");
  let idoO=parseInt(document.getElementById("ido-ora").value||0),idoP=parseInt(document.getElementById("ido-perc").value||0),idoS=parseInt(document.getElementById("ido-mp").value||0);
  let respO=parseInt(document.getElementById("resp-ora").value||0),respP=parseInt(document.getElementById("resp-perc").value||0),respS=parseInt(document.getElementById("resp-mp").value||0);
  totalMs=(respO*3600+respP*60+respS)*1000;
  if(totalMs<=0){document.getElementById("eredmeny").innerText="Adj meg érvényes respawn időt!";return;}
  const startTime=new Date(ev,honap-1,nap,idoO,idoP,idoS);
  const now=new Date();
  let elapsedMs = now-startTime;
  let cycles = Math.floor(elapsedMs/totalMs);
  let lastSpawn = new Date(startTime.getTime()+cycles*totalMs);
  nextSpawn=new Date(lastSpawn.getTime()+totalMs);
  document.getElementById("eredmeny").innerHTML=`Eltelt ciklusok: ${cycles}<br>Utolsó spawn: ${lastSpawn.toLocaleString("hu-HU")}<br>Következő spawn: ${nextSpawn.toLocaleString("hu-HU")}`;
  interval=setInterval(update,100);
}
function update(){
  const now=new Date(),diff=nextSpawn-now;
  const fill=document.getElementById("visszaFill"),text=document.getElementById("visszaText");
  if(diff<=0){fill.style.width="100%";text.innerText="RESPAWN!";showModal("RESPAWN!",true);clearInterval(interval);return;}
  const ora=Math.floor(diff/3600000),perc=Math.floor((diff%3600000)/60000),mp=Math.floor((diff%60000)/1000);
  text.innerText=`${String(ora).padStart(2,'0')}:${String(perc).padStart(2,'0')}:${String(mp).padStart(2,'0')}`;
  fill.style.width=(diff/totalMs*100)+"%";
  if(fiveMinAlert && !fiveMinShown && totalMs>300000 && diff/1000<=300){fiveMinShown=true;showModal("5 perc a respawnig!",false);}
}
function stop(){if(interval){clearInterval(interval);interval=null;}document.getElementById("visszaFill").style.width="100%";document.getElementById("visszaText").innerText="00:00:00";document.getElementById("eredmeny").innerText="Számláló leállítva.";}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Atherion Script Dashboard</title>

<style>
body{
    background: radial-gradient(circle,#0f172a,#020617);
    font-family: Arial;
    color:white;
    text-align:center;
}

/* cím */
h1{
    margin-top:30px;
    color:#22d3ee;
    text-shadow:0 0 15px #22d3ee;
}

/* tab gombok */
.tabs{
    margin-top:30px;
}

.tab-btn{
    background:linear-gradient(145deg,#111827,#020617);
    border:2px solid #334155;
    color:white;
    padding:12px 25px;
    margin:5px;
    border-radius:8px;
    cursor:pointer;
    transition:0.2s;
}

.tab-btn:hover{
    border-color:#22d3ee;
    box-shadow:0 0 10px #22d3ee;
}

/* aktív gomb */
.active{
    border-color:#22d3ee;
    box-shadow:0 0 15px #22d3ee;
}

/* tartalom */
.tab-content{
    display:none;
    margin-top:40px;
}

.tab-content iframe{
    width:900px;
    height:400px;
    border:none;
    border-radius:12px;
    background:black;
    box-shadow:0 0 25px rgba(0,255,255,0.25);
}

.footer{
    margin-top:50px;
    opacity:0.6;
}
</style>
</head>

<body>

<h1>Metin2 Script Inventory</h1>

<div class="tabs">
<button class="tab-btn active" onclick="openTab(1)">Script 1</button>
<button class="tab-btn" onclick="openTab(2)">Script 2</button>
</div>

<div id="tab1" class="tab-content" style="display:block;">
<iframe src="https://script.google.com/macros/s/AKfycbxpzxIoRx9c-eHiolmtLIF10hy9QtSREJZmUcCdaSjf8hpD1ytfnwcJh1esW_Fl8Cyy4g/exec"></iframe>
</div>

<div id="tab2" class="tab-content">
<iframe src="https://script.google.com/macros/s/AKfycbx170_GtIceSLF6Az3Hdl5VvppkbdZJCKrFrKUytScbt5ZKawRsRmijstGrQzhDCJDD/exec"></iframe>
</div>

<div class="footer">
Atherion Tools System
</div>

<script>
function openTab(n){
    document.querySelectorAll(".tab-content").forEach(t=>t.style.display="none");
    document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));

    document.getElementById("tab"+n).style.display="block";
    document.querySelectorAll(".tab-btn")[n-1].classList.add("active");
}
</script>

</body>
</html>

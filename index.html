<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atherion Gaming</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Arial;background-image:url('https://metin2.download/picture/UOIXWBG4d1PsC0Bjiga6EHj4c380szxg/.jpg');background-size:cover;color:white;}
.header{text-align:center;font-family:'Cinzel';font-size:60px;color:#00cfff;text-shadow:0 0 30px #00cfff;margin-bottom:10px;}
.dashboard{display:none;height:100vh;flex-direction:column;}
.dashboard-body{display:flex;flex:1;}
.menu{width:220px;background:rgba(0,0,0,0.8);padding:20px;display:flex;flex-direction:column;gap:10px;}
.menu-slot{padding:12px;border:2px solid #3a6f9e;border-radius:8px;text-align:center;cursor:pointer;font-family:'Cinzel';color:#00cfff;background:#070d14;transition:0.3s;}
.menu-slot:hover{box-shadow:0 0 20px #00cfff;}
.content{flex:1;background:rgba(0,0,0,0.6);padding:25px;overflow:auto;border-radius:10px;margin-left:10px;position:relative;}
.start-screen{height:100vh;display:flex;align-items:center;justify-content:center;gap:60px;background:rgba(0,0,0,0.7);}
.start-btn{padding:25px 50px;font-size:28px;font-family:'Cinzel';border:2px solid #00cfff;background:linear-gradient(#0b1a2a,#02060c);color:#00eaff;cursor:pointer;border-radius:12px;transition:0.3s;box-shadow:0 0 20px rgba(0,200,255,0.4);}
.start-btn:hover{transform:scale(1.1);box-shadow:0 0 40px #00cfff;}
/* Metinkő box */
#metinkoBox{display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.85);padding:20px;border-radius:12px;border:2px solid #00cfff;width:300px;max-width:90%;z-index:10;}
#metinkoBox h2{color:#00cfff;text-align:center;margin-bottom:15px;font-family:'Cinzel';}
#metinkoBox .time-panel{display:flex;justify-content:space-between;margin-bottom:10px;}
#metinkoBox .time-panel input{width:30%;padding:6px;border-radius:6px;border:2px solid #3a6f9e;background:#070d14;color:#00eaff;text-align:center;}
#metinkoBox button{width:48%;margin-top:10px;padding:10px;border-radius:6px;border:2px solid #3a6f9e;background:#001a26;color:#00eaff;cursor:pointer;}
#metinkoBar{margin-top:10px;height:30px;background:rgba(0,0,0,0.4);border:2px solid #3a6f9e;border-radius:15px;position:relative;overflow:hidden;}
#metinkoFill{height:100%;width:100%;background:rgba(0,200,255,0.4);border-radius:15px 0 0 15px;position:relative;}
#metinkoText{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:white;font-weight:bold;font-family:'Cinzel';}
</style>
</head>
<body>

<div class="start-screen" id="start">
<button class="start-btn" onclick="enter('magic')">Magic Time Two</button>
<button class="start-btn" onclick="enter('mystic')">Mystic of Masters</button>
</div>

<div class="dashboard" id="dashboard">
<div class="header">Atherion Gaming</div>
<div class="dashboard-body">
<div class="menu" id="menu"></div>
<div class="content" id="mainContent"></div>
</div>
</div>

<div id="metinkoBox">
<h2>Metinkő Kalkulátor</h2>
<label>Dátum:</label>
<input type="date" id="metDatum">
<div class="time-panel">
<input type="text" id="metOra" maxlength="2"><span>:</span>
<input type="text" id="metPerc" maxlength="2"><span>:</span>
<input type="text" id="metMp" maxlength="2">
</div>
<div class="time-panel">
<input type="text" id="respOra" maxlength="2"><span>:</span>
<input type="text" id="respPerc" maxlength="2"><span>:</span>
<input type="text" id="respMp" maxlength="2">
</div>
<button onclick="metIndit()">Indítás</button>
<button onclick="metStop()">STOP</button>
<div id="metinkoBar">
  <div id="metinkoFill"></div>
  <div id="metinkoText">00:00:00</div>
</div>
</div>

<script>
let current="";
const config={
magic:{
  title:"Magic Time Two",
  scripts:[{name:"Eventek", url:"https://script.google.com/macros/s/AKfycbxpzxIoRx9c-eHiolmtLIF10hy9QtSREJZmUcCdaSjf8hpD1ytfnwcJh1esW_Fl8Cyy4g/exec"}],
  yt:"https://www.youtube.com/@atheriongames8520"
},
mystic:{
  title:"Mystic of Masters",
  scripts:[],
  yt:"https://www.youtube.com/@AndurilMysticofMasters"
}
};
const mainContent=document.getElementById("mainContent");
function enter(type){
  current=type;
  document.getElementById("start").style.display="none";
  document.getElementById("dashboard").style.display="flex";
  loadMenu();
  mainContent.innerHTML="";
}
function goBack(){
  document.getElementById("start").style.display="flex";
  document.getElementById("dashboard").style.display="none";
  current="";
}
function loadMenu(){
  const menu=document.getElementById("menu");
  menu.innerHTML="";
  const back=document.createElement("div");
  back.className="menu-slot";
  back.textContent="Vissza";
  back.onclick=goBack;
  menu.appendChild(back);

  config[current].scripts.forEach(s=>{
    const div=document.createElement("div");
    div.className="menu-slot";
    div.textContent=s.name;
    div.onclick=()=>{window.open(s.url,"_blank");};
    menu.appendChild(div);
  });

  const ytBtn=document.createElement("div");
  ytBtn.className="menu-slot";
  ytBtn.textContent="YouTube";
  ytBtn.onclick=()=>{window.open(config[current].yt,"_blank");};
  menu.appendChild(ytBtn);

  const galBtn=document.createElement("div");
  galBtn.className="menu-slot";
  galBtn.textContent="Galéria";
  galBtn.onclick=()=>{window.location.href="https://atheriongaming.github.io/gallery/";};
  menu.appendChild(galBtn);

  if(current==="mystic"){
    const metBtn=document.createElement("div");
    metBtn.className="menu-slot";
    metBtn.textContent="Metinkő Kalkulátor";
    metBtn.onclick=()=>{document.getElementById("metinkoBox").style.display="block";};
    menu.appendChild(metBtn);
  }
}

// --- Metinkő logika (egyszerűsített, animáció + idő) ---
let metInterval=null;
let totalMs=0;
let nextSpawn=null;
function pad(n){return n.toString().padStart(2,'0');}
function metIndit(){
  if(metInterval) clearInterval(metInterval);
  const datum=document.getElementById("metDatum").value;
  const [y,m,d]=datum.split("-");
  const h=parseInt(document.getElementById("metOra").value||0);
  const min=parseInt(document.getElementById("metPerc").value||0);
  const s=parseInt(document.getElementById("metMp").value||0);
  const rh=parseInt(document.getElementById("respOra").value||0);
  const rmin=parseInt(document.getElementById("respPerc").value||0);
  const rs=parseInt(document.getElementById("respMp").value||0);
  totalMs=(rh*3600+rmin*60+rs)*1000;
  const startTime=new Date(y,m-1,d,h,min,s);
  nextSpawn=new Date(startTime.getTime()+totalMs);
  metInterval=setInterval(updateMet,100);
}
function updateMet(){
  const now=new Date();
  let diff=nextSpawn-now;
  const fill=document.getElementById("metinkoFill");
  const text=document.getElementById("metinkoText");
  if(diff<=0){
    text.innerText="RESPAWN!";
    fill.style.width="100%";
    fill.style.backgroundColor="rgba(200,50,50,0.6)";
    clearInterval(metInterval);
    return;
  }
  const hr=Math.floor(diff/3600000);
  const mn=Math.floor((diff%3600000)/60000);
  const sc=Math.floor((diff%60000)/1000);
  text.innerText=`${pad(hr)}:${pad(mn)}:${pad(sc)}`;
  fill.style.width=(diff/totalMs*100)+"%";
  if(diff<60000) fill.style.backgroundColor="rgba(200,50,50,0.6)";
  else if(diff<180000) fill.style.backgroundColor="rgba(0,200,255,0.6)";
  else fill.style.backgroundColor="rgba(0,100,150,0.6)";
}
function metStop(){if(metInterval){clearInterval(metInterval);metInterval=null;document.getElementById("metinkoText").innerText="00:00:00";document.getElementById("metinkoFill").style.width="100%";document.getElementById("metinkoFill").style.backgroundColor="rgba(0,200,255,0.4)";}}
</script>
</body>
</html>

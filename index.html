<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Atherion Gaming</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    font-family: Arial, sans-serif;
    background-image:url('https://metin2.download/picture/UOIXWBG4d1PsC0Bjiga6EHj4c380szxg/.jpg');
    background-size:cover;
    background-position:center;
    background-attachment:fixed;
    color:#fff;
    display:flex;
    min-height:100vh;
}

/* BAL MENÜ */
.menu{
    width:220px;
    background:rgba(0,0,0,0.7);
    padding:20px 10px;
    display:flex;
    flex-direction:column;
    gap:15px;
    flex-shrink:0;
    box-shadow: 2px 0 10px rgba(0,0,0,0.5);
}
.menu-slot{
    background:linear-gradient(145deg,#1a1a1a,#050505);
    border:2px solid #3a6f9e;
    border-radius:10px;
    padding:10px;
    text-align:center;
    color:#00cfff;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
    position:relative;
    font-family: 'Cinzel', serif;
    text-shadow: 0 0 3px #00aaff, 0 0 6px #00cfff;
}
.menu-slot:hover{
    animation: blueFlame 1s infinite alternate;
}
@keyframes blueFlame{
    0%{text-shadow: 0 0 5px #00cfff, 0 0 10px #00aaff, 0 0 15px #0077ff;}
    50%{text-shadow: 0 0 10px #00e5ff, 0 0 15px #00bfff, 0 0 25px #0099ff;}
    100%{text-shadow: 0 0 5px #00cfff, 0 0 10px #00aaff, 0 0 15px #0077ff;}
}

/* JOBB OLDAL */
.overlay{
    flex:1;
    background:rgba(0,0,0,0.65);
    padding:20px 30px;
    display:flex;
    flex-direction:column;
}

/* HEADER */
.header{
    text-align:center;
    padding-top:20px;
}
.header h1{
    font-family: 'Cinzel', serif;
    font-size:72px;
    letter-spacing:3px;
    color:#00cfff;
    text-shadow:
        0 0 5px #00cfff,
        0 0 10px #00bfff,
        0 0 20px #00bfff,
        0 0 30px #00aaff,
        0 0 40px #0099ff,
        0 0 50px #0088ff,
        0 0 75px #0077ff;
    animation: neonGlow 2s ease-in-out infinite alternate;
}
@keyframes neonGlow{
    from {
        text-shadow:
        0 0 5px #00cfff,
        0 0 10px #00bfff,
        0 0 20px #00bfff,
        0 0 30px #00aaff,
        0 0 40px #0099ff,
        0 0 50px #0088ff,
        0 0 75px #0077ff;
    }
    to {
        text-shadow:
        0 0 10px #00e5ff,
        0 0 20px #00dfff,
        0 0 30px #00d0ff,
        0 0 40px #00c5ff,
        0 0 50px #00b8ff,
        0 0 60px #00aaff,
        0 0 100px #009fff;
    }
}

/* IFRAME TARTALOM */
#content-frame{
    flex:1;
    border:none;
    margin-top:20px;
    border-radius:12px;
    box-shadow: 0 0 20px rgba(0,196,255,0.5);
}
</style>
</head>
<body>

<!-- BAL MENÜ -->
<div class="menu" id="menu"></div>

<!-- JOBB OLDAL -->
<div class="overlay">
<div class="header">
<h1>Atherion Gaming</h1>
</div>

<iframe id="content-frame" src="" width="100%" height="600px"></iframe>

</div>

<script>
/* MENÜ + SCRIPT CONFIG */
const menuSlots = [
  {name:"Magic Time Two", type:"script", url:"https://script.google.com/macros/s/AKfycbxpzxIoRx9c-eHiolmtLIF10hy9QtSREJZmUcCdaSjf8hpD1ytfnwcJh1esW_Fl8Cyy4g/exec"},
  {name:"Mystic of Masters", type:"script", url:"https://script.google.com/macros/s/AKfycbx170_GtIceSLF6Az3Hdl5VvppkbdZJCKrFrKUytScbt5ZKawRsRmijstGrQzhDCJDD/exec"},
  {name:"Atherion Game's", type:"youtube", url:"https://www.youtube.com/@atheriongames8520"},
  {name:"Anduril Mystic of Masters", type:"youtube", url:"https://www.youtube.com/@AndurilMysticofMasters"},
  {name:"Név5", type:"placeholder", url:"#"},
  {name:"Név6", type:"placeholder", url:"#"},
  {name:"Név7", type:"placeholder", url:"#"},
  {name:"Név8", type:"placeholder", url:"#"},
  {name:"Név9", type:"placeholder", url:"#"},
  {name:"Név10", type:"placeholder", url:"#"}
];

const menu = document.getElementById("menu");
const contentFrame = document.getElementById("content-frame");

menuSlots.forEach(slot=>{
  const div = document.createElement("div");
  div.className="menu-slot";
  div.textContent = slot.name;
  div.onclick = ()=>{
    if(slot.type==="script"){
      contentFrame.src = slot.url;
    } else if(slot.type==="youtube"){
      window.open(slot.url,"_blank");
    }
  };
  menu.appendChild(div);
});
</script>

</body>
</html>

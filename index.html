<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Atherion Script Dashboard</title>

<style>
body{
    background: radial-gradient(circle,#0f172a,#020617);
    font-family: Arial;
    color:white;
    text-align:center;
}

h1{
    margin-top:30px;
    color:#22d3ee;
    text-shadow:0 0 15px #22d3ee;
}

/* inventory */
.inventory{
    width:500px;
    margin:50px auto;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

/* slot */
.slot{
    height:120px;
    background:linear-gradient(145deg,#111827,#020617);
    border:2px solid #334155;
    border-radius:12px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:0.2s;
}

.slot:hover{
    border-color:#22d3ee;
    box-shadow:0 0 20px #22d3ee;
    transform:scale(1.05);
}

.footer{
    margin-top:40px;
    opacity:0.6;
}
</style>
</head>

<body>

<h1>Metin2 Script Inventory</h1>

<div class="inventory">

<div class="slot" onclick="openScript(1)">
Script 1
</div>

<div class="slot" onclick="openScript(2)">
Script 2
</div>

</div>

<div class="footer">
Atherion Tools System
</div>

<script>
function openScript(n){

if(n===1){
window.open("https://script.google.com/macros/s/AKfycbxpzxIoRx9c-eHiolmtLIF10hy9QtSREJZmUcCdaSjf8hpD1ytfnwcJh1esW_Fl8Cyy4g/exec","_blank");
}

if(n===2){
window.open("https://script.google.com/macros/s/AKfycbx170_GtIceSLF6Az3Hdl5VvppkbdZJCKrFrKUytScbt5ZKawRsRmijstGrQzhDCJDD/exec","_blank");
}

}
</script>

</body>
</html>

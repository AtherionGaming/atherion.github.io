<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atherion Gaming</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Arial,sans-serif;background-image:url('https://metin2.download/picture/UOIXWBG4d1PsC0Bjiga6EHj4c380szxg/.jpg');background-size:cover;color:white;}
.header{text-align:center;font-family:'Cinzel';font-size:60px;color:#00cfff;text-shadow:0 0 30px #00cfff;margin-bottom:10px;}
.start-screen{height:100vh;display:flex;align-items:center;justify-content:center;gap:60px;background:rgba(0,0,0,0.7);}
.start-btn{padding:25px 50px;font-size:28px;font-family:'Cinzel';border:2px solid #00cfff;background:linear-gradient(#0b1a2a,#02060c);color:#00eaff;cursor:pointer;border-radius:12px;transition:0.3s;box-shadow:0 0 20px rgba(0,200,255,0.4);}
.start-btn:hover{transform:scale(1.1);box-shadow:0 0 40px #00cfff;}
.dashboard{display:none;flex-direction:column;height:100vh;}
.menu{display:flex;flex-direction:column;width:220px;background:rgba(0,0,0,0.8);padding:20px;gap:10px;}
.menu-slot{padding:12px;border:2px solid #3a6f9e;border-radius:8px;text-align:center;cursor:pointer;font-family:'Cinzel';color:#00cfff;background:#070d14;transition:0.3s;}
.menu-slot:hover{box-shadow:0 0 20px #00cfff;}
.content{flex:1;background:rgba(0,0,0,0.6);padding:25px;overflow:auto;border-radius:10px;margin-left:10px;display:flex;justify-content:center;align-items:center;}
#metinBox{width:350px;padding:20px;background:rgba(0,0,0,0.8);border-radius:12px;}
</style>
</head>
<body>

<div class="start-screen" id="start">
<button class="start-btn" onclick="enter('magic')">Magic Time Two</button>
<button class="start-btn" onclick="enter('mystic')">Mystic of Masters</button>
</div>

<div class="dashboard" id="dashboard">
<div class="header">Atherion Gaming</div>
<div style="display:flex;flex:1;">
<div class="menu" id="menu"></div>
<div class="content" id="mainContent"></div>
</div>
</div>

<script>
let current="";
const config={
magic:{title:"Magic Time Two", yt:"https://www.youtube.com/@atheriongames8520"},
mystic:{title:"Mystic of Masters", yt:"https://www.youtube.com/@AndurilMysticofMasters"}
};

function enter(type){
  current=type;
  document.getElementById("start").style.display="none";
  document.getElementById("dashboard").style.display="flex";
  loadMenu();
  mainContent.innerHTML="";
}

function goBack(){
  document.getElementById("start").style.display="flex";
  document.getElementById("dashboard").style.display="none";
  current="";
}

function loadMenu(){
  const menu=document.getElementById("menu");
  menu.innerHTML="";
  const back=document.createElement("div");
  back.className="menu-slot"; back.textContent="Vissza"; back.onclick=goBack;
  menu.appendChild(back);

  const galBtn=document.createElement("div");
  galBtn.className="menu-slot"; galBtn.textContent="Galéria"; galBtn.onclick=()=>{window.location.href='https://atheriongaming.github.io/gallery/?server='+current;};
  menu.appendChild(galBtn);

  if(current==='mystic'){
    const metinBtn=document.createElement("div");
    metinBtn.className="menu-slot"; metinBtn.textContent="Metinkő Generátor"; metinBtn.onclick=()=>{showMetinBox();};
    menu.appendChild(metinBtn);
  }
}

function showMetinBox(){
  mainContent.innerHTML=`
    <div id="metinBox">
      <h2 style="color:#00cfff;text-align:center;">Metinkő Kalkulátor</h2>
      <label>Dátum:</label>
      <input type="date" id="datum" style="width:100%;padding:5px;margin-bottom:5px;">
      <div style="display:flex;gap:5px;margin-bottom:5px;">
        <input type="number" id="ido-ora" placeholder="Óra" style="flex:1;">
        <input type="number" id="ido-perc" placeholder="Perc" style="flex:1;">
        <input type="number" id="ido-mp" placeholder="Mp" style="flex:1;">
      </div>
      <div style="display:flex;gap:5px;margin-bottom:5px;">
        <input type="number" id="resp-ora" placeholder="Óra" style="flex:1;">
        <input type="number" id="resp-perc" placeholder="Perc" style="flex:1;">
        <input type="number" id="resp-mp" placeholder="Mp" style="flex:1;">
      </div>
      <button onclick="indit()">Indítás</button>
      <button onclick="stop()">STOP</button>
      <button onclick="toggleFiveMin()" id="fiveMinBtn">5 perces figyelmeztetés</button>
      <button onclick="toggleAutoRestart()" id="autoBtn">Automata újraindítás</button>
      <div id="visszaszamlalo-bar" style="margin-top:10px;height:30px;background:rgba(0,0,0,0.4);border:2px solid #00cfff;border-radius:12px;position:relative;">
        <div id="visszaFill" style="height:100%;width:100%;background:rgba(0,200,255,0.6);border-radius:12px;"></div>
        <div id="visszaText" style="position:absolute;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-weight:bold;">00:00:00</div>
      </div>
      <div id="eredmeny" style="margin-top:10px;color:#00cfff;"></div>
      <div id="aktualisIdo" style="margin-top:10px;font-size:12px;color:#ccc;"></div>
    </div>
  `;
  beallitMaiDatum();
  frissitIdo();
}
</script>

<script>
// Itt a teljes Metinkő kalkulátor JS: indit(), update(), stop(), toggleFiveMin(), toggleAutoRestart(), showModal(), closeModal(), stb.
// Ugyanaz, mint az előző Metinkő script, de a színek kékes/cyberpunk stílusra átállítva
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Atherion Gaming</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    font-family: Arial, sans-serif;
    background-image:url('https://metin2.download/picture/UOIXWBG4d1PsC0Bjiga6EHj4c380szxg/.jpg');
    background-size:cover;
    background-position:center;
    background-attachment:fixed;
    color:#fff;
}
.overlay{
    background:rgba(0,0,0,0.65);
    min-height:100vh;
    padding-bottom:50px;
}
.header{
    text-align:center;
    padding-top:40px;
    animation: glow 3s infinite alternate;
}
.header h1{
    font-family: 'Cinzel', serif;
    font-size:56px;
    letter-spacing:3px;
    color:#ffd27a;
    text-shadow:
        0 0 15px #ffcc66,
        0 0 25px #ffb84d,
        0 0 40px #ffb84d;
}
@keyframes glow{
from{opacity:0.85}
to{opacity:1}
}
.inventory{
    width:90%;
    max-width:960px;
    margin:50px auto;
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(120px,1fr));
    gap:20px;
}
.slot{
    background:linear-gradient(145deg,#1a1a1a,#050505);
    border:2px solid #6b4b1d;
    border-radius:12px;
    padding:10px;
    text-align:center;
    transition:0.25s;
    cursor:pointer;
    position:relative;
    animation: fadeIn 0.6s ease forwards;
}
.slot:hover{
    transform:scale(1.1);
    box-shadow:
        0 0 20px #ffcc66,
        0 0 40px rgba(255,204,102,0.5),
        0 0 60px rgba(255,180,60,0.3);
}
.icon{
    width:64px;
    height:64px;
    margin:auto;
    background-size:cover;
    background-position:center;
    border-radius:6px;
    margin-bottom:10px;
    transition:0.3s;
}
.slot:hover .icon{
    transform:scale(1.2);
}
.title{
    font-size:14px;
    color:#ffd27a;
    font-weight:bold;
    text-shadow: 0 0 4px #222;
}
@keyframes fadeIn{
from{opacity:0; transform:translateY(15px)}
to{opacity:1; transform:translateY(0)}
}
.footer{
    text-align:center;
    margin-top:40px;
    opacity:0.7;
    font-size:14px;
}
/* Tooltip */
.slot::after{
    content: attr(data-title);
    position:absolute;
    bottom:120%;
    left:50%;
    transform:translateX(-50%);
    background:rgba(0,0,0,0.85);
    padding:4px 8px;
    border-radius:6px;
    font-size:12px;
    color:#fff;
    opacity:0;
    pointer-events:none;
    transition:0.3s;
    white-space:nowrap;
}
.slot:hover::after{
    opacity:1;
}
</style>
</head>
<body>
<div class="overlay">

<div class="header">
<h1>Atherion Gaming</h1>
</div>

<div id="inventory" class="inventory"></div>

<div class="footer">
Metin2 Event Dashboard
</div>
</div>

<script>
/* SCRIPT CONFIG */
const scripts = [
{
title: "Magic Time Two",
url: "https://script.google.com/macros/s/AKfycbxpzxIoRx9c-eHiolmtLIF10hy9QtSREJZmUcCdaSjf8hpD1ytfnwcJh1esW_Fl8Cyy4g/exec",
icon: "https://yt3.googleusercontent.com/ytc/AIdro_nf9XJtTfezgZuCM980nW2mfbJqcw_d7NsULkRGXu8-PA=s900-c-k-c0x00ffffff-no-rj"
},
{
title: "Mystic of Masters",
url: "https://script.google.com/macros/s/AKfycbx170_GtIceSLF6Az3Hdl5VvppkbdZJCKrFrKUytScbt5ZKawRsRmijstGrQzhDCJDD/exec",
icon: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQHEq6eoNv8-FCY7wXczFQ3CFu-4qFkE27vuw&s"
},
{
title: "",
url: "",
icon: ""
},
{
title: "",
url:"",
icon:""
},
{
title: "",
url:"",
icon:""
},
{
title: "",
url:"",
icon:""
},
{
title: "",
url:"",
icon:""
}
];

const inventory = document.getElementById("inventory");
scripts.forEach(script=>{
if(script.url!==""){
    const slot=document.createElement("div");
    slot.className="slot";
    slot.setAttribute("data-title",script.title);
    slot.onclick=()=>{window.open(script.url,"_blank");};
    slot.innerHTML=`<div class="icon" style="background-image:url('${script.icon}')"></div>
                      <div class="title">${script.title}</div>`;
    inventory.appendChild(slot);
}
});
</script>
</body>
</html>

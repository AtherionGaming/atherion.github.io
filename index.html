<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atherion Gaming</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Arial;background-image:url('https://metin2.download/picture/UOIXWBG4d1PsC0Bjiga6EHj4c380szxg/.jpg');background-size:cover;color:white;}
.header{text-align:center;font-family:'Cinzel';font-size:60px;color:#00cfff;text-shadow:0 0 30px #00cfff;margin-bottom:10px;}
.dashboard{display:none;height:100vh;flex-direction:column;}
.dashboard-body{display:flex;flex:1;}
.menu{width:220px;background:rgba(0,0,0,0.8);padding:20px;display:flex;flex-direction:column;gap:10px;}
.menu-slot{padding:12px;border:2px solid #3a6f9e;border-radius:8px;text-align:center;cursor:pointer;font-family:'Cinzel';color:#00cfff;background:#070d14;transition:0.3s;}
.menu-slot:hover{box-shadow:0 0 20px #00cfff;}
.content{flex:1;background:rgba(0,0,0,0.6);padding:25px;overflow:auto;border-radius:10px;margin-left:10px;}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,150px);gap:15px;margin-top:20px;}
.gallery img{width:150px;height:150px;object-fit:cover;border-radius:8px;border:2px solid #00cfff;cursor:pointer;}
.upload-form{display:flex;flex-direction:column;gap:10px;width:300px;}
.upload-form input, .upload-form button{padding:8px;border-radius:6px;border:2px solid #00cfff;background:#001a26;color:#00eaff;font-family:'Cinzel';}
.upload-form button{cursor:pointer;}
.start-screen{height:100vh;display:flex;align-items:center;justify-content:center;gap:60px;background:rgba(0,0,0,0.7);}
.start-btn{padding:25px 50px;font-size:28px;font-family:'Cinzel';border:2px solid #00cfff;background:linear-gradient(#0b1a2a,#02060c);color:#00eaff;cursor:pointer;border-radius:12px;transition:0.3s;box-shadow:0 0 20px rgba(0,200,255,0.4);}
.start-btn:hover{transform:scale(1.1);box-shadow:0 0 40px #00cfff;}
/* Mobil barát */
@media(max-width:768px){
  .dashboard-body{flex-direction:column;}
  .menu{width:100%;display:flex;flex-direction:row;flex-wrap:wrap;justify-content:center;}
  .menu-slot{flex:1 1 45%;margin:5px;}
  .content{margin-left:0;margin-top:10px;padding:15px;}
}
/* Metinkő panel */
#metinkoPanel{display:none;margin-top:15px;background:rgba(0,50,80,0.8);padding:15px;border-radius:10px;}
#metinkoPanel input{width:20%;margin:2px;text-align:center;padding:5px;border-radius:4px;border:1px solid #00cfff;background:#001a26;color:#00eaff;}
#metinkoPanel button{margin:5px;padding:8px 12px;border-radius:6px;border:1px solid #00cfff;background:#002f50;color:#00eaff;cursor:pointer;}
</style>
</head>
<body>

<div class="start-screen" id="start">
<button class="start-btn" onclick="enter('magic')">Magic Time Two</button>
<button class="start-btn" onclick="enter('mystic')">Mystic of Masters</button>
</div>

<div class="dashboard" id="dashboard">
<div class="header">Atherion Gaming</div>
<div class="dashboard-body">
<div class="menu" id="menu"></div>
<div class="content" id="mainContent"></div>
</div>
</div>

<script>
let current="";
const config={
magic:{title:"Magic Time Two",scripts:[{name:"Eventek",url:"https://script.google.com/macros/s/AKfycbxpzxIoRx9c-eHiolmtLIF10hy9QtSREJZmUcCdaSjf8hpD1ytfnwcJh1esW_Fl8Cyy4g/exec"}],yt:"https://www.youtube.com/@atheriongames8520"},
mystic:{title:"Mystic of Masters",scripts:[{name:"Metinkő időzítő",url:"#metinkoPanel"}],yt:"https://www.youtube.com/@AndurilMysticofMasters"}
};

function enter(type){
  current=type;
  document.getElementById("start").style.display="none";
  document.getElementById("dashboard").style.display="flex";
  loadMenu();
  mainContent.innerHTML="";
  if(type==='mystic') showMetinko();
}
function goBack(){
  window.location.href="https://atheriongaming.github.io/index/";
}

function loadMenu(){
  const menu=document.getElementById("menu");
  menu.innerHTML="";
  const back=document.createElement("div");
  back.className="menu-slot";
  back.textContent="Vissza";
  back.onclick=goBack;
  menu.appendChild(back);

  config[current].scripts.forEach(s=>{
    const div=document.createElement("div");
    div.className="menu-slot";
    div.textContent=s.name;
    div.onclick=()=>{if(s.url==="#metinkoPanel") showMetinko(); else window.open(s.url,"_blank");};
    menu.appendChild(div);
  });

  const ytBtn=document.createElement("div");
  ytBtn.className="menu-slot";
  ytBtn.textContent="YouTube";
  ytBtn.onclick=()=>{window.open(config[current].yt,"_blank");};
  menu.appendChild(ytBtn);

  const galBtn=document.createElement("div");
  galBtn.className="menu-slot";
  galBtn.textContent="Galéria";
  galBtn.onclick=()=>{window.location.href="https://atheriongaming.github.io/gallery/?server="+current;};
  menu.appendChild(galBtn);
}

function showMetinko(){
  if(!document.getElementById('metinkoPanel')){
    const panel=document.createElement('div');
    panel.id='metinkoPanel';
    panel.innerHTML=`<h3>Metinkő időzítő</h3>
      <label>Dátum:</label><input type='date' id='mDatum'><br>
      <div>Indítás idő: <input type='text' id='mOra' maxlength='2'>:<input type='text' id='mPerc' maxlength='2'>:<input type='text' id='mMp' maxlength='2'></div>
      <div>Respawn idő: <input type='text' id='rOra' maxlength='2'>:<input type='text' id='rPerc' maxlength='2'>:<input type='text' id='rMp' maxlength='2'></div>
      <button onclick='mIndit()'>Indítás</button>
      <button onclick='mStop()'>STOP</button>
      <button onclick='toggleFiveMin()' id='fiveMinBtn'>5 perces figyelmeztetés</button>
      <button onclick='toggleAutoRestart()' id='autoBtn'>Automata újraindítás</button>
      <div id='visszaszamlalo-bar' style='margin-top:10px; height:25px; background:rgba(0,0,0,0.3); border:1px solid #00cfff; border-radius:10px; overflow:hidden; position:relative;'>
        <div id='visszaFill' style='width:100%;height:100%;background:rgba(0,100,150,0.5);'></div>
        <div id='visszaText' style='position:absolute;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:12px;color:#00eaff;font-weight:bold;'>00:00:00</div>
      </div>
      <div id='eredmeny' style='margin-top:10px;'></div>
      `;
    document.getElementById('mainContent').appendChild(panel);
  }
  document.getElementById('metinkoPanel').style.display='block';
}
</script>
</body>
</html>

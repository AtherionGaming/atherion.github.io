<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atherion Gaming</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Arial;background-image:url('https://metin2.download/picture/UOIXWBG4d1PsC0Bjiga6EHj4c380szxg/.jpg');background-size:cover;color:white;}
.header{text-align:center;font-family:'Cinzel';font-size:60px;color:#00cfff;text-shadow:0 0 30px #00cfff;margin-bottom:10px;}
.dashboard{display:none;height:100vh;flex-direction:column;}
.dashboard-body{display:flex;flex:1;gap:10px;flex-wrap:wrap;}
.menu{width:220px;background:rgba(0,0,0,0.8);padding:20px;display:flex;flex-direction:column;gap:10px;}
.menu-slot{padding:12px;border:2px solid #3a6f9e;border-radius:8px;text-align:center;cursor:pointer;font-family:'Cinzel';color:#00cfff;background:#070d14;transition:0.3s;}
.menu-slot:hover{box-shadow:0 0 20px #00cfff;}
.content{flex:1;background:rgba(0,0,0,0.6);padding:25px;overflow:auto;border-radius:10px;}
.start-screen{height:100vh;display:flex;align-items:center;justify-content:center;gap:60px;background:rgba(0,0,0,0.7);flex-wrap:wrap;}
.start-btn{padding:25px 50px;font-size:28px;font-family:'Cinzel';border:2px solid #00cfff;background:linear-gradient(#0b1a2a,#02060c);color:#00eaff;cursor:pointer;border-radius:12px;transition:0.3s;box-shadow:0 0 20px rgba(0,200,255,0.4);}
.start-btn:hover{transform:scale(1.1);box-shadow:0 0 40px #00cfff;}
</style>
</head>
<body>

<div class="start-screen" id="start">
  <button class="start-btn" onclick="enter('magic')">Magic Time Two</button>
  <button class="start-btn" onclick="enter('mystic')">Mystic of Masters</button>
</div>

<div class="dashboard" id="dashboard">
  <div class="header">Atherion Gaming</div>
  <div class="dashboard-body">
    <div class="menu" id="menu"></div>
    <div class="content" id="mainContent"></div>
  </div>
</div>

<script>
let current="";
const config={
magic:{
  title:"Magic Time Two",
  scripts:[{name:"Eventek", url:"https://script.google.com/macros/s/AKfycbxpzxIoRx9c-eHiolmtLIF10hy9QtSREJZmUcCdaSjf8hpD1ytfnwcJh1esW_Fl8Cyy4g/exec"}],
  yt:"https://www.youtube.com/@atheriongames8520"
},
mystic:{
  title:"Mystic of Masters",
  scripts:[],
  yt:"https://www.youtube.com/@AndurilMysticofMasters"
}
};

function enter(type){
  current=type;
  document.getElementById("start").style.display="none";
  document.getElementById("dashboard").style.display="flex";
  loadMenu();
  mainContent.innerHTML="";
}

function goBack(){
  document.getElementById("start").style.display="flex";
  document.getElementById("dashboard").style.display="none";
  current="";
}

// MENU
function loadMenu(){
  const menu=document.getElementById("menu");
  menu.innerHTML="";

  const back=document.createElement("div");
  back.className="menu-slot";
  back.textContent="Vissza";
  back.onclick=goBack;
  menu.appendChild(back);

  config[current].scripts.forEach(s=>{
    const div=document.createElement("div");
    div.className="menu-slot";
    div.textContent=s.name;
    div.onclick=()=>{window.open(s.url,"_blank");};
    menu.appendChild(div);
  });

  const ytBtn=document.createElement("div");
  ytBtn.className="menu-slot";
  ytBtn.textContent="YouTube";
  ytBtn.onclick=()=>{window.open(config[current].yt,"_blank");};
  menu.appendChild(ytBtn);

  const galBtn=document.createElement("div");
  galBtn.className="menu-slot";
  galBtn.textContent="Galéria";
  galBtn.onclick=()=>{window.location.href="/gallery/";};
  menu.appendChild(galBtn);

  if(current==="mystic"){
    const spawnBtn=document.createElement("div");
    spawnBtn.className="menu-slot";
    spawnBtn.textContent="Metinkő generátor";
    spawnBtn.onclick=()=>{loadMetinko();}
    menu.appendChild(spawnBtn);
  }
}

function loadMetinko(){
  mainContent.innerHTML=`<iframe src="metinko.html" style="width:100%;height:600px;border:none;border-radius:12px;"></iframe>`;
}

</script>
</body>
</html>
